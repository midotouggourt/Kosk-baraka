<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>HIRRO 23.2 - فندور بيع فقط - من 1 الى 23.2</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Tahoma;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:row-reverse;height:100vh;overflow:hidden;background:#eef2f7;touch-action:manipulation}
#sidebar{width:84px;background:#1e4a9c;display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:6px;overflow-y:auto}
#sidebar button{width:70px;height:60px;background:#fff;border-radius:14px;border:none;font-size:9px;font-weight:900;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 2px 5px #0003}
#sidebar button.active{background:#ffeb3b;outline:3px solid #fff}
#sidebar button b{font-size:18px}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topSale{min-height:145px;background:#212121;display:flex;flex-direction:column;padding:8px;gap:6px}
.topSaleTop{display:flex;align-items:center;justify-content:space-between;gap:6px}
.topSaleTop h1{color:#ff3b3b;font-size:26px;font-weight:900;flex:1}
.barcodeBox{flex:1;background:#fff3cd;border:2px solid #ff9800;border-radius:12px;padding:4px;display:flex;align-items:center;gap:4px;box-shadow:0 0 0 3px #ff980033}
.barcodeBox input{flex:1;border:none;background:transparent;padding:8px;font-weight:900;font-size:12px;outline:none}
.view{display:none;flex:1;overflow:auto;flex-direction:column}
.view.show{display:flex}
.centerSale{flex:1;display:flex;overflow:hidden}
.leftActions{width:68px;background:#d6dde8;display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:6px;border-right:3px solid #1e4a9c}
.leftActions button{width:56px;height:44px;background:#fff;border:2px solid #333;border-radius:10px;font-size:18px;font-weight:900;cursor:pointer}
.tableWrap{flex:1;display:flex;flex-direction:column;background:#fff;overflow:hidden}
.tableHead{background:#212121;color:#fff;display:grid;grid-template-columns:1fr 52px 82px 92px;font-size:10px;padding:10px;text-align:center;font-weight:900}
.tableBody{flex:1;overflow-y:auto}
.rowCart{display:grid;grid-template-columns:1fr 52px 82px 92px;padding:10px;border-bottom:1px solid #ddd;font-size:11px;text-align:center;align-items:center;cursor:pointer;transition:all 0.2s}
.rowCart:hover{background:#e3f2fd}
.rowCart.selected{background:#ffeb3b !important;border:2px solid #000;font-weight:900;box-shadow:0 2px 8px #0003}
.bottomSale{
 height:auto;
 min-height:250px;
 max-height:55vh;
 background:#d6dde8;
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:8px;
 overflow-y:auto;
 overflow-x:hidden;
 padding:8px;
}
.prodBox{
 width:auto;
 min-width:auto;
 height:auto;
 min-height:90px;
 background:#fff;
 border-radius:10px;
 padding:6px;
 display:flex;
 flex-direction:column;
 align-items:center;
}
.prodBox img{
 width:100%;
 height:50px;
 object-fit:contain;
}
.prodBox b{
 font-size:9px;
 text-align:center;
}
@media(min-width:768px){
 .bottomSale{
  grid-template-columns:repeat(7,1fr);
 }
}
.actionBar button{flex:1;height:48px;border-radius:11px;border:none;font-weight:900;font-size:10px;cursor:pointer}
.card{background:#fff;border-radius:12px;padding:14px;margin:8px;box-shadow:0 3px 15px #0001}
.label{font-size:11px;font-weight:900;color:#0d47a1;margin-top:8px;display:block}
.input,.select{width:100%;padding:11px;border:2px solid #b0bec5;border-radius:11px;margin-top:3px;background:#fff;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>div{flex:1;min-width:100px}
.btn{padding:10px 12px;border:none;border-radius:10px;font-weight:900;cursor:pointer;font-size:11px}
.btn-green{background:#2e7d32;color:#fff}.btn-blue{background:#1565c0;color:#fff}.btn-red{background:#c62828;color:#fff}.btn-yellow{background:#ffeb3b;color:#000}
table.list{width:100%;border-collapse:collapse;margin-top:8px}
table.list th{background:#1e4a9c;color:#fff;padding:7px;font-size:9px}
table.list td{padding:6px;border-bottom:1px solid #e0e0e0;font-size:10px;text-align:center}
.login{position:fixed;inset:0;background:linear-gradient(135deg,#0d47a1,#1e2f4a);display:flex;align-items:center;justify-content:center;z-index:999999}
.loginBox{background:#fff;padding:20px;border-radius:18px;width:94%;max-width:360px;text-align:center;position:relative;z-index:1000000}
.loginUser{display:flex;gap:6px;margin:10px 0}
.loginUser button{flex:1;padding:10px;border:2px solid #1e4a9c;border-radius:10px;background:#fff;font-weight:900;cursor:pointer;font-size:11px}
.loginUser button.active{background:#1e4a9c;color:#fff}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:99999}
.modal.show{display:flex}
.modalBig{background:#fff;padding:14px;border-radius:16px;width:96%;max-width:420px;max-height:90vh;overflow:auto;box-shadow:0 10px 30px #0005}
.priceBtn{width:100%;padding:15px;margin:6px 0;border:2px solid #1e4a9c;border-radius:12px;background:#fff;font-weight:900;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.priceBtn.yellow{background:#ffeb3b;border:3px solid #000}
.priceBtn.green{background:#e8f5e9;border:3px solid #2e7d32;color:#2e7d32}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#c62828;color:#fff;padding:11px 22px;border-radius:24px;z-index:100000;font-weight:900;box-shadow:0 5px 14px #0005;font-size:12px}
.toast.ok{background:#2e7d32}
.statFilterBox{background:#e3f2fd;padding:10px;border-radius:12px;margin-bottom:10px;border:2px solid #1e4a9c}
.heldBar{display:flex;gap:6px;padding:6px;background:#fff3cd;border-bottom:3px solid #ff9800;overflow-x:auto;min-height:54px;align-items:center}
.heldItem{min-width:110px;height:44px;background:#fff;border:2px solid #ff9800;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:4px;position:relative}
.heldItem .del{position:absolute;top:-6px;right:-6px;background:#c62828;color:#fff;border-radius:50%;width:16px;height:16px;font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#receipt58{display:none}
@media print{body *{visibility:hidden !important}#receipt58,#receipt58 *{visibility:visible !important}#receipt58{display:block !important;position:absolute;left:0;top:0;width:58mm;background:#fff;padding:2mm;font-family:monospace;color:#000}@page{size:58mm auto;margin:0}}
@media(max-width:768px){#sidebar{width:100%;height:58px;flex-direction:row;justify-content:space-around;position:fixed;bottom:0;left:0;right:0;padding:3px;z-index:10}#sidebar button{width:42px;height:48px;font-size:7px}body{padding-bottom:58px}}
.prodBox{z-index:1!important;position:relative!important}
#prodGridSale{z-index:1!important;position:relative!important}
div[style*="width:60px"]{z-index:60!important;position:relative!important;background:#d6dde8!important}
</style>
</head>
<body>
<div id="login" class="login"><div class="loginBox"><h1 style="color:#1e4a9c">🏪 HIRRO 23.2</h1><h3 style="color:#2e7d32">فندور بيع فقط 🛒 - 1 الى 23.2</h3><div class="loginUser"><button id="btnAdmin" class="active" onclick="setUser('admin')">👑<br>Admin</button><button id="btnVend" onclick="setUser('vendeur')">🧑‍💼<br>Vendeur</button></div><input id="lp" type="tel" inputmode="numeric" pattern="[0-9]*" autocomplete="off" class="input" placeholder="••••" style="text-align:center;font-size:22px;letter-spacing:8px;background:#fff3cd;border:2px solid #1e4a9c;pointer-events:auto;touch-action:manipulation" autofocus><p style="font-size:8px;color:green">✅ 23.2 - فندور ممنوع من الاعدادات - يبيع برك</p><p style="font-size:9px;color:#0d47a1">Admin: 1234 | Vendeur: 5678 - بيع فقط</p></div></div>
<p id="amountCalc" style="text-align:center;font-size:11px;font-weight:900;color:#0d47a1;margin-top:10px;background:#fff;padding:6px;border-radius:8px">اكتب المبلغ باش يحسب الوزن - اي منتوج</p>
</div>
<div class="row" style="margin-top:10px"><div><button class="btn btn-green" style="width:100%;padding:13px;font-size:14px" onclick="confirmAmountSell()">✅ بيع <span id="amountBtnText">100 دج</span></button></div><div><button class="btn btn-red" style="width:100%;padding:13px" onclick="closeAmountModal()">❌</button></div></div>
</div></div>
<div id="purchaseModal" class="modal"><div class="modalBig" style="max-width:1050px"><h2 style="text-align:center;font-size:14px">🧾 فاتورة شراء - <span id="purSupName"></span></h2><div class="row" style="margin-top:8px"><div><input id="purSearch" class="input" placeholder="حرف أول" oninput="renderPurProducts()"></div><div><select id="purFam" class="select" onchange="renderPurProducts()"><option value="">كل</option><option>الوزن</option><option>التبغ والكبريت</option></select></div><div><input id="purBarcode" class="input" placeholder="باركود + Enter" onkeydown="if(event.key==='Enter') addPurByBarcode()"></div></div><div style="display:flex;gap:5px;overflow-x:auto;padding:6px;background:#eef2f7;border-radius:10px;margin-top:6px;min-height:86px" id="purProdList"></div><div id="purCart"></div><div class="row"><div><input id="purTotalIn" class="input" readonly placeholder="مجموع س"></div><div><input id="purPaid" type="number" class="input" value="0" oninput="calcPurDebt()" placeholder="مدفوع س"></div><div><input id="purDebt" class="input" readonly placeholder="باقي س"></div></div><div class="row" style="margin-top:10px"><div><button class="btn btn-green" style="width:100%;padding:13px" onclick="confirmPurchase()">✅ تأكيد</button></div><div><button class="btn btn-red" style="width:100%;padding:13px" onclick="closePurchase()">❌</button></div></div></div></div>
<div id="receipt58"><div style="text-align:center;border-bottom:1px dashed #000;padding-bottom:2mm"><b>محل البركة - 23.2</b><br><small id="rDate"></small></div><div id="rItems"></div><div style="border-top:1px dashed #000;margin-top:2mm"><div style="display:flex;justify-content:space-between;font-weight:900"><span>المجموع:</span><span id="rTotal">0 س</span></div><div style="display:flex;justify-content:space-between;font-size:9px"><span>الزبون:</span><span id="rClient">عادي</span></div></div></div>
<script>
// === إعدادات عامة ===
let loginUser='admin';let adminPass=localStorage.getItem('HIRRO_PASS')||'1234';let vendPass=localStorage.getItem('HIRRO_VEND_PASS')||'5678';
function setUser(u){loginUser=u;document.getElementById('btnAdmin').classList.toggle('active',u==='admin');document.getElementById('btnVend').classList.toggle('active',u==='vendeur');let el=document.getElementById('lp');if(el){el.value='';el.focus();}}
let lpEl=document.getElementById('lp');
if(lpEl){
 lpEl.addEventListener('input',e=>{
  let v=e.target.value.trim();
  if(v.length<4) return;
  let ok=(loginUser==='admin'&&v===adminPass)||(loginUser==='vendeur'&&v===vendPass);
  if(ok){
   document.getElementById('login').style.display='none';
   currentUser=loginUser;
   try{renderAll();renderSup();renderClients();renderFact();resetStats();renderHeld();}catch(err){}
  }
 });
 lpEl.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.target.dispatchEvent(new Event('input')); } });
}
let currentUser=null;
let prods=JSON.parse(localStorage.getItem('HIRRO_23_PRODS')||'[]');
let clients=JSON.parse(localStorage.getItem('HIRRO_23_CLIENTS')||'[]');
let sups=JSON.parse(localStorage.getItem('HIRRO_23_SUPS')||'[]');
let sales=JSON.parse(localStorage.getItem('HIRRO_23_SALES')||'[]');
let purchases=JSON.parse(localStorage.getItem('HIRRO_23_PUR')||'[]');
let heldSales=JSON.parse(localStorage.getItem('HIRRO_23_HELD')||'[]');
let shopSettings=JSON.parse(localStorage.getItem('HIRRO_23_SHOP')||'{"name":"محل البركة","phone":"","addr":""}');
let bcs=[],cart=[],currentImg="",selectedProd=null,purCart=[],curSup=null;
let selectedCartIndex=-1;
let isPriceModalOpen=false;
let currentStatFilter={fromDate:null,toDate:null};
let editId=null;
function showV(id){if(currentUser==='vendeur'&&id!=='sale'){showToast('⛔ ممنوع - الفندور بيع فقط 🛒',false);return;}if(isPriceModalOpen) return;document.querySelectorAll('.view').forEach(v=>v.classList.remove('show'));document.getElementById(id).classList.add('show');document.querySelectorAll('#sidebar button').forEach(b=>b.classList.remove('active'));let btn=document.getElementById('b'+id.charAt(0).toUpperCase()+id.slice(1));if(btn) btn.classList.add('active');if(id==='sale') setTimeout(()=>{if(!isPriceModalOpen) document.getElementById('barcodeSale').focus()},200);if(id==='stats' && !currentStatFilter.fromDate) resetStats();if(id==='settings') loadSettings();}
function showToast(m,ok=true){let t=document.createElement('div');t.className='toast '+(ok?'ok':'');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}function changeAdminPass(){let oldP=document.getElementById('oldAdmin').value.trim();let newP=document.getElementById('newAdmin').value.trim();if(!oldP||!newP){showToast('⛔ اكتب القديم والجديد',false);return;}if(oldP!==adminPass){showToast('⛔ كود خطأ',false);return;}if(newP.length<4){showToast('⛔ 4 أرقام',false);return;}adminPass=newP;localStorage.setItem('HIRRO_PASS',newP);document.getElementById('oldAdmin').value='';document.getElementById('newAdmin').value='';showToast('✅ تغيير أدمن',true);}
function changeVendPass(){if(currentUser!=='admin' && loginUser!=='admin'){showToast('⛔ فقط الأدمن',false);return;}let oldP=document.getElementById('oldVend').value.trim();let newP=document.getElementById('newVend').value.trim();let validOld=(oldP===vendPass||oldP===adminPass);if(!validOld){showToast('⛔ كود خطأ',false);return;}if(newP.length<4){showToast('⛔ 4 أرقام',false);return;}vendPass=newP;localStorage.setItem('HIRRO_VEND_PASS',newP);document.getElementById('oldVend').value='';document.getElementById('newVend').value='';showToast('✅ تغيير فندور',true);}
function saveShopSettings(){let name=document.getElementById('setShopName').value.trim();let phone=document.getElementById('setShopPhone').value.trim();let addr=document.getElementById('setShopAddr').value.trim();shopSettings={name:name||'محل البركة',phone:phone,addr:addr};localStorage.setItem('HIRRO_23_SHOP',JSON.stringify(shopSettings));showToast('✅ حفظ محل',true);loadSettings();}
function saveStockSettings(){let low=document.getElementById('setLowLimit').value;let grid=document.getElementById('setGridCount').value;let curr=document.getElementById('setCurrency').value;localStorage.setItem('HIRRO_23_LOW',low);localStorage.setItem('HIRRO_23_GRID',grid);localStorage.setItem('HIRRO_23_CURRENCY',curr);showToast('✅ حفظ مخزون '+low+'/'+grid+'/'+curr,true);renderAll();loadSettings();}
function exportData(){let data={prods,clients,sups,sales,purchases,shopSettings,date:new Date().toISOString(),version:'HIRRO_23_4'};let blob=new Blob([JSON.stringify(data)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='HIRRO_23_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();showToast('📤 تصدير',true);}
function importData(){let input=document.createElement('input');input.type='file';input.accept='.json';input.onchange=e=>{let file=e.target.files[0];if(!file) return;let reader=new FileReader();reader.onload=ev=>{try{let data=JSON.parse(ev.target.result);if(confirm('استيراد؟')){prods=data.prods||[];clients=data.clients||[];sups=data.sups||[];sales=data.sales||[];purchases=data.purchases||[];localStorage.setItem('HIRRO_23_PRODS',JSON.stringify(prods));localStorage.setItem('HIRRO_23_CLIENTS',JSON.stringify(clients));localStorage.setItem('HIRRO_23_SUPS',JSON.stringify(sups));localStorage.setItem('HIRRO_23_SALES',JSON.stringify(sales));localStorage.setItem('HIRRO_23_PUR',JSON.stringify(purchases));renderAll();renderSup();renderClients();renderFact();renderSalesFiltered();loadSettings();showToast('✅ استيراد',true);}}catch(err){showToast('❌ ملف خطأ',false);}};reader.readAsText(file);};input.click();}
function clearSales(){if(confirm('مسح المبيعات؟')){let code=prompt('كود الأدمن');if(code!==adminPass){showToast('⛔ كود خطأ',false);return;}sales=[];purchases=[];localStorage.setItem('HIRRO_23_SALES','[]');localStorage.setItem('HIRRO_23_PUR','[]');renderSalesFiltered();renderFamProfitFiltered();renderFact();showToast('🗑️ مسح',true);}}
function factoryReset(){if(confirm('اعادة مصنع؟')){let code=prompt('اكتب '+adminPass+' RESET');if(code!==adminPass+' RESET'){showToast('⛔ خطأ',false);return;}localStorage.clear();prods=[];clients=[];sups=[];sales=[];purchases=[];heldSales=[];location.reload();}}
function loadSettings(){let shop=JSON.parse(localStorage.getItem('HIRRO_23_SHOP')||'{"name":"محل البركة","phone":"","addr":""}');document.getElementById('setShopName').value=shop.name||'';document.getElementById('setShopPhone').value=shop.phone||'';document.getElementById('setShopAddr').value=shop.addr||'';document.getElementById('setLowLimit').value=localStorage.getItem('HIRRO_23_LOW')||20;document.getElementById('setGridCount').value=localStorage.getItem('HIRRO_23_GRID')||12;document.getElementById('setCurrency').value=localStorage.getItem('HIRRO_23_CURRENCY')||'سنتيم';let info=document.getElementById('appInfo');if(info) info.textContent=`المنتجات: ${prods.length} | الزبائن: ${clients.length} | المبيعات: ${sales.length} - v24 احترافي`;}
function saveP(){let pn=document.getElementById('pn').value.trim();if(!pn){showToast('❌ اسم',false);return;}if(!bcs.length){showToast('❌ باركود',false);return;}if(!currentImg){showToast('❌ صورة',false);return;}for(let bc of bcs){let dup = prods.find(p=>p.barcodes.includes(bc) && p.id!=editId);if(dup){showToast('⛔ باركود موجود في: '+dup.name,false);return;}}let qpbV=+document.getElementById('qpb').value||1;let boxesV=+document.getElementById('boxQty').value||0;let total=boxesV*qpbV;let s4QtyV=+document.getElementById('s4Qty').value||3;if(editId){let idx=prods.findIndex(p=>p.id==editId);if(idx>=0){prods[idx].name=pn;prods[idx].barcodes=[...bcs];prods[idx].qpb=qpbV;prods[idx].s1=+document.getElementById('s1').value||0;prods[idx].s2=+document.getElementById('s2').value||0;prods[idx].s3=+document.getElementById('s3').value||0;prods[idx].s4=+document.getElementById('s4').value||0;prods[idx].s4Qty=s4QtyV;prods[idx].s4Price=+document.getElementById('s4').value||0;prods[idx].buy=+document.getElementById('buy').value||0;prods[idx].totalStock=total;prods[idx].qt=total;prods[idx].fam=document.getElementById('fam').value;prods[idx].exp=document.getElementById('exp').value;prods[idx].img=currentImg;prods[idx].lowLimit=+document.getElementById('lowLimit').value||500;}localStorage.setItem('HIRRO_23_PRODS',JSON.stringify(prods));showToast('✅ تعديل: '+pn,true);cancelEdit();} else {let obj={id:Date.now(),name:pn,barcodes:[...bcs],qpb:qpbV,s1:+document.getElementById('s1').value||0,s2:+document.getElementById('s2').value||0,s3:+document.getElementById('s3').value||0,s4:+document.getElementById('s4').value||0,s4Qty:s4QtyV,s4Price:+document.getElementById('s4').value||0,buy:+document.getElementById('buy').value||0,qt:total,totalStock:total,fam:document.getElementById('fam').value,exp:document.getElementById('exp').value,img:currentImg,lowLimit:+document.getElementById('lowLimit').value||500,date:Date.now()};prods.push(obj);localStorage.setItem('HIRRO_23_PRODS',JSON.stringify(prods));showToast('✅ حفظ '+pn,true);bcs=[];document.getElementById('pn').value='';document.getElementById('bl').innerHTML='';currentImg='';document.getElementById('imgPrev').innerHTML='📷 صورة';document.getElementById('buy').value='';document.getElementById('s1').value='';document.getElementById('s2').value='';document.getElementById('s3').value='';document.getElementById('s4').value='';}renderAll();showV('sale');}
function editProduct(id){let p=prods.find(x=>x.id==id);if(!p) return;editId=p.id;showV('add');document.getElementById('addTitle').textContent='✏️ تعديل منتج';document.getElementById('saveBtn').textContent='💾 تعديل';document.getElementById('saveBtn').style.cssText='width:100%;margin-top:12px;padding:14px;background:#ff9800;color:#000;border:2px solid #000';document.getElementById('cancelEditBtn').style.display='block';document.getElementById('editBanner').style.display='block';document.getElementById('editBanner').textContent='✏️ تعديل: '+p.name;document.getElementById('pn').value=p.name;bcs=[...p.barcodes];renderBC();currentImg=p.img;document.getElementById('imgPrev').innerHTML=`<img src="${p.img}" style="height:60px;width:100%;object-fit:cover;border-radius:8px">`;document.getElementById('fam').value=p.fam;onFamChange();document.getElementById('boxQty').value=Math.floor((p.totalStock||p.qt||0)/(p.qpb||1));document.getElementById('realStock').value=p.totalStock||p.qt||0;document.getElementById('lowLimit').value=p.lowLimit||500;document.getElementById('buy').value=p.buy||'';document.getElementById('s1').value=p.s1||'';document.getElementById('s2').value=p.s2||'';document.getElementById('s3').value=p.s3||'';document.getElementById('s4').value=p.s4||'';document.getElementById('qpb').value=p.qpb||1;calcStock();}

 });
 return d<0?0:d;
}

 document.getElementById('stCreditToday').textContent=todayRemaining.toLocaleString()+' س';
 let h=document.getElementById('salesHistory');
 h.innerHTML='';
 filtered.slice(-100).reverse().forEach(s=>{
  h.innerHTML+=`<tr><td>${new Date(s.date).toLocaleString('ar-DZ')}</td><td>${s.name}</td><td>${s.sell} س</td><td style="color:green;font-weight:900">${Math.round(s.profit)} س</td></tr>`;
 });
}
function renderFamProfitFiltered(){let filtered=getFilteredSales();let famBody=document.getElementById('famProfitBody');if(!famBody) return;let fams=["الوزن","التبغ والكبريت","المواد الغذائية","الكوسميتيك","القهوة"];famBody.innerHTML='';fams.forEach(fam=>{let famSales=filtered.filter(s=>s.fam===fam);let sell=famSales.reduce((a,b)=>a+b.sell,0);let profit=famSales.reduce((a,b)=>a+b.profit,0);if(sell>0){famBody.innerHTML+=`<tr><td><b>${fam}</b></td><td>${sell} س</td><td style="color:green">${profit} س</td><td>${famSales.length}</td></tr>`;}});}
let btDevice=null,btChar=null;async function getBTPrinter(){try{let device=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'POS'},{namePrefix:'MPT'},{namePrefix:'Printer'},{namePrefix:'RPP'},{namePrefix:'XP'},{namePrefix:'58'},{namePrefix:'80'}],optionalServices:['0000ff00-0000-1000-8000-00805f9b34fb','000018f0-0000-1000-8000-00805f9b34fb','e7810a71-73ae-499d-8c15-faa9aef0c3f2']});let server=await device.gatt.connect();let services=await server.getPrimaryServices();for(let svc of services){let chars=await svc.getCharacteristics();for(let ch of chars){if(ch.properties.write||ch.properties.writeWithoutResponse){btDevice=device;btChar=ch;return ch;}}}throw 'no char';}catch(e){showToast('⛔ لم يتم اختيار طابعة: '+e,false);return null;}}
function escPos(txt,w){let enc=new TextEncoder();let INIT=[27,64];let CENTER=[27,97,1];let LEFT=[27,97,0];let BOLD_ON=[27,69,1];let BOLD_OFF=[27,69,0];let CUT=[29,86,65,0];let line=(w=='80mm'?'------------------------------------------':'------------------------------');let shop=JSON.parse(localStorage.getItem('HIRRO_23_SHOP')||'{"name":"محل البركة"}');let data=[...INIT,...CENTER,...BOLD_ON,...enc.encode(shop.name+'\n'),...BOLD_OFF,...enc.encode((shop.phone||'')+'\n'+new Date().toLocaleString('ar-DZ')+'\n'+line+'\n'),...LEFT,...enc.encode(txt+'\n'+line+'\n'),...CENTER,...enc.encode('شكرا لزيارتكم\n'),...CUT];return new Uint8Array(data);}
async function printDirect(width){let items=cart.length>0?cart:(sales.length>0?[{name:sales[sales.length-1]?.name||'منتج',q:1,s1:sales[sales.length-1]?.sell||0}]:[]);if(!items.length){showToast('⛔ لا يوجد',false);return;}let tot=0;let txt='';let sel=document.getElementById('saleClient');let client=sel?.options[sel.selectedIndex]?.text||'عادي';txt+=`زبون: ${client}\n`;items.forEach(it=>{let t=it.s1*(it.q||1);tot+=t;txt+=`${it.name} x${it.q||1} = ${t} س\n`;});txt+=`\nالمجموع: ${tot} سنتيم\n`;try{if(!btChar){await getBTPrinter();}if(btChar){let data=escPos(txt,width);await btChar.writeValue(data);showToast(`✅ طباعة مباشرة ${width} - ${tot} س`,true);return;}}catch(e){console.log(e);}printFallback(width,items,tot,client);}
function printFallback(w,items,tot,client){let shop=JSON.parse(localStorage.getItem('HIRRO_23_SHOP')||'{"name":"محل البركة"}');let r=document.getElementById('receipt58');if(!r){r=document.createElement('div');r.id='receipt58';document.body.appendChild(r);}r.style.width=w;r.innerHTML=`<b>${shop.name}</b><br>${client}<br>${items.map(i=>`${i.name} x${i.q||1} = ${i.s1*i.q} س`).join('<br>')}<br><b>المجموع ${tot} س</b>`;document.getElementById('printSize')?.remove();let s=document.createElement('style');s.id='printSize';s.innerHTML=`@page{size:${w} auto;margin:0}`;document.head.appendChild(s);setTimeout(()=>window.print(),300);}
function printReceipt58(){printDirect('58mm');}
function printReceipt80(){printDirect('80mm');}
function addClient(){let n=document.getElementById('clName').value.trim();if(!n){showToast('❌ اسم',false);return;}clients.push({id:Date.now(),name:n,phone:document.getElementById('clPhone').value,debt:+document.getElementById('clDebt').value||0});localStorage.setItem('HIRRO_23_CLIENTS',JSON.stringify(clients));document.getElementById('clName').value='';document.getElementById('clPhone').value='';document.getElementById('clDebt').value=0;renderClients();renderClientSelect();showToast('✅ زبون',true);}
function renderClients(){
 let b=document.getElementById('clientBody');
 if(!b) return;
 b.innerHTML='';
 clients.forEach(c=>{
  c.debt=getRealDebt(c.name);
  b.innerHTML+=`<tr><td><b>${c.name}</b></td><td style="color:${c.debt>0?'red':'green'};font-weight:900">${c.debt} س</td><td><button class="btn btn-green" style="padding:4px 6px;font-size:9px" onclick="payDebtClient('${c.name}')">💵</button> <button class="btn btn-red" style="padding:3px 5px" onclick="if(confirm('حذف؟')){clients=clients.filter(x=>x.id!=${c.id});localStorage.setItem('HIRRO_23_CLIENTS',JSON.stringify(clients));renderClients();}">X</button></td></tr>`;
 });
 localStorage.setItem('HIRRO_23_CLIENTS',JSON.stringify(clients));
 renderClientSelect();
}
function addSup(){let n=document.getElementById('supName').value.trim();if(!n){showToast('❌ اسم',false);return;}sups.push({id:Date.now(),name:n,phone:document.getElementById('supPhone').value,comp:document.getElementById('supComp').value,debt:0});localStorage.setItem('HIRRO_23_SUPS',JSON.stringify(sups));document.getElementById('supName').value='';document.getElementById('supPhone').value='';document.getElementById('supComp').value='';renderSup();showToast('✅ مورد',true);}
function renderSup(){let b=document.getElementById('supBody');if(!b) return;b.innerHTML='';sups.forEach(s=>{b.innerHTML+=`<tr><td><b style="color:#0d47a1;cursor:pointer;text-decoration:underline" onclick="openPurchase(${s.id})">🧾 ${s.name}</b></td><td style="color:${(s.debt||0)>0?'red':'green'};font-weight:900">${s.debt||0} س</td><td><button class="btn btn-blue" style="padding:4px 6px;font-size:9px" onclick="openPurchase(${s.id})">🧾</button> <button class="btn btn-red" style="padding:3px 5px" onclick="if(confirm('حذف؟')){sups=sups.filter(x=>x.id!=${s.id});localStorage.setItem('HIRRO_23_SUPS',JSON.stringify(sups));renderSup();}">X</button></td></tr>`;});}
function openPurchase(supId){curSup=sups.find(x=>x.id==supId);if(!curSup) return;document.getElementById('purSupName').textContent=curSup.name;purCart=[];document.getElementById('purSearch').value='';document.getElementById('purFam').value='';document.getElementById('purBarcode').value='';document.getElementById('purPaid').value=0;document.getElementById('purchaseModal').classList.add('show');renderPurProducts();renderPurCart();}
function closePurchase(){document.getElementById('purchaseModal').classList.remove('show');purCart=[];setTimeout(()=>{if(!isPriceModalOpen) document.getElementById('barcodeSale').focus()},200);}
function renderPurProducts(){let q=(document.getElementById('purSearch').value||'').toLowerCase().trim();let fam=document.getElementById('purFam').value;let list=document.getElementById('purProdList');list.innerHTML='';let filtered=prods.filter(p=>{let ml=!q||p.name.toLowerCase().startsWith(q)||p.name.toLowerCase().includes(q)||p.barcodes.some(b=>b.includes(q));let mf=!fam||p.fam==fam;return ml&&mf;});if(filtered.length==0){list.innerHTML='<div style="padding:10px;color:#666;width:100%;text-align:center">🔍</div>';return;}filtered.slice(0,40).forEach(p=>{list.innerHTML+=`<div onclick="addToPurCart(${p.id})" style="width:82px;min-width:82px;height:82px;background:#fff;border:2px solid #333;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer"><img src="${p.img}" style="width:62px;height:42px;object-fit:cover"><b style="font-size:7px">${p.name}</b><small>${p.totalStock||p.qt} ${p.fam==='الوزن'?'غ':'ق'}</small></div>`;});}
function addPurByBarcode(){let code=document.getElementById('purBarcode').value.trim();if(!code) return;let p=prods.find(x=>x.barcodes.some(b=>b.includes(code)||code.includes(b)));if(!p){showToast('❌ غير موجود',false);return;}addToPurCart(p.id);document.getElementById('purBarcode').value='';}
function addToPurCart(id){let p=prods.find(x=>x.id==id);if(!p) return;let ex=purCart.find(x=>x.id==id);if(ex){ex.qty+=p.qpb||20;renderPurCart();return;}purCart.push({id:p.id,name:p.name,qty:p.qpb||20,buy:p.buy,s1:p.s1,s2:p.s2,s3:p.s3,s4:p.s4,qpb:p.qpb||20});renderPurCart();}
function renderPurCart(){let el=document.getElementById('purCart');el.innerHTML='';let total=0;purCart.forEach((it,i)=>{let t=it.buy*(it.qty/(it.qpb||1));total+=t;el.innerHTML+=`<div style="display:grid;grid-template-columns:1.8fr 52px 62px 52px 52px 52px 52px 36px;font-size:9px;padding:4px;border-bottom:1px solid #ddd;align-items:center;gap:3px"><span><b>${it.name}</b></span><input type="number" value="${it.qty}" oninput="purCart[${i}].qty=+this.value||0;renderPurCart()"><input type="number" value="${it.buy}" oninput="purCart[${i}].buy=+this.value||0;renderPurCart()"><input type="number" value="${it.s1}" oninput="purCart[${i}].s1=+this.value||0"><input type="number" value="${it.s2}" oninput="purCart[${i}].s2=+this.value||0"><input type="number" value="${it.s3}" oninput="purCart[${i}].s3=+this.value||0"><input type="number" value="${it.s4}" oninput="purCart[${i}].s4=+this.value||0"><button class="btn btn-red" style="padding:3px" onclick="purCart.splice(${i},1);renderPurCart()">X</button></div>`;});document.getElementById('purTotalIn').value=total+' سنتيم';calcPurDebt();}
function calcPurDebt(){let total=purCart.reduce((a,b)=>a+b.buy*(b.qty/(b.qpb||1)),0);let paid=+document.getElementById('purPaid').value||0;document.getElementById('purDebt').value=(total-paid)+' سنتيم';}
function confirmPurchase(){if(!purCart.length){showToast('⛔ فارغة',false);return;}let total=purCart.reduce((a,b)=>a+b.buy*(b.qty/(b.qpb||1)),0);let paid=+document.getElementById('purPaid').value||0;let debt=total-paid;purCart.forEach(it=>{let idx=prods.findIndex(x=>x.id==it.id);if(idx>=0){prods[idx].totalStock=(prods[idx].totalStock||prods[idx].qt||0)+it.qty;prods[idx].qt=prods[idx].totalStock;prods[idx].buy=it.buy;prods[idx].s1=it.s1;prods[idx].s2=it.s2;prods[idx].s3=it.s3;prods[idx].s4=it.s4;}});localStorage.setItem('HIRRO_23_PRODS',JSON.stringify(prods));if(curSup){curSup.debt=(curSup.debt||0)+debt;localStorage.setItem('HIRRO_23_SUPS',JSON.stringify(sups));}purchases.push({id:Date.now(),type:'purchase',date:new Date().toISOString(),sup:curSup?curSup.name:'-',total:total,paid:paid,debt:debt});localStorage.setItem('HIRRO_23_PUR',JSON.stringify(purchases));showToast('✅ فاتورة '+total+' س',true);closePurchase();renderAll();renderSup();renderSalesFiltered();renderFamProfitFiltered();renderFact();}
function renderFact(){let b=document.getElementById('factBody');if(!b) return;b.innerHTML='';let all=[...sales.map(s=>({type:s.type,total:s.sell,date:s.date,party:s.client||s.name||'زبون'})),...purchases.map(p=>({type:'purchase',total:p.total,date:p.date,party:p.sup||'-',debt:p.debt}))];all.slice(-80).reverse().forEach(f=>{b.innerHTML+=`<tr><td>${f.type==='purchase'?'🚚 شراء':f.type==='credit'?'💳 كريدي':'💵 بيع'}</td><td>${new Date(f.date).toLocaleString('ar-DZ')}</td><td>${f.party}</td><td>${f.total} س</td><td>${f.debt||0} س</td></tr>`;});}
document.addEventListener('keydown',e=>{if(e.key==='F1'){e.preventDefault();if(!isPriceModalOpen) completeSale();}if(e.key==='Escape' && isPriceModalOpen){closeModal();closeAmountModal();}});
